# Garment Type Detection Rules
# ====================================
# This file defines how to detect product type from position names or Part IDs.
# The system uses this to select the correct detector module.
#
# HOW IT WORKS:
# 1. First checks if position name contains any keywords
# 2. Then checks if Part ID starts with any defined prefix
# 3. Defaults to T-SHIRT if no match
#
# NOTE: Canvas size is controlled ONLY by user selection in the GUI,
# not auto-detected from garment type.

detectionRules:
  CAP:
    # Position keywords that indicate a cap
    keywords:
      - CROWN
      - CAP
    # Part ID prefixes that indicate caps (e.g., C112, CP80)
    prefixes:
      - C
      - CP
    
  BAG:
    keywords:
      - BAG
    # Part ID prefixes (e.g., BG100, BG205)
    prefixes:
      - BG
    
  BLANKET:
    keywords:
      - TOWEL
      - NAPKIN
      - CENTER
      - BLANKET
      - ANGLED
    # Part ID prefixes (e.g., BP10, BP20)
    prefixes:
      - BP
    
  T-SHIRT:
    # Default - matches when nothing else matches
    keywords: []
    prefixes: []

# Additional product type aliases (all map to the main types above)
typeAliases:
  # All these map to T-SHIRT
  SHIRT: T-SHIRT
  SCRUB TOP: T-SHIRT
  SCRUB PANT: T-SHIRT
  JACKET: T-SHIRT
  HOODIE: T-SHIRT
  SWEAT SHIRT: T-SHIRT
  POLO: T-SHIRT
  
  # All these map to CAP
  HAT: CAP
  VISOR: CAP
  
  # All these map to BLANKET
  TOWEL: BLANKET
  NAPKIN: BLANKET
