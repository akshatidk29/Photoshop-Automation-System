# Color Abbreviations

# This file maps color abbreviations to their full names.
# The system will use these to match images even when colors are abbreviated differently.

# HOW TO ADD NEW COLORS:
# 1. Find the abbreviation used in your image filenames
# 2. Add it under 'aliases' with the full color name(s) it should match
# 3. Save the file - changes take effect immediately

# Format: abbreviation: [list of full names it should match]

aliases:
  # Complex multi-word color patterns (add full color → abbreviated form)
  midgreydarkheathermidgrey: [midgydhmgy]

  # Careismatic / scrubs - filenames abbreviate or misspell the colour name.
  # Keyed by the FULL colour as written in the Excel, mapped to the forms that
  # actually appear in filenames (e.g. MC2660_CLOD.jpg for "Cloud").
  cloud: [clod]
  galaxy: [glxy]
  grape: [grap]
  huntergreen: [hntr, hnter, hntergreen, hunter]
  olive: [oliv]
  pewter: [pwtr, pewte]
  royal: [royl]
  lilac: [lila]
  shockingpink: [shockpink]
  ciel: [ceil]

